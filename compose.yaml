services:
  app:
    build: .
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      HOST: 0.0.0.0
      PORT: 3000
      PUBLIC_URL: ${PUBLIC_URL:-http://127.0.0.1:3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-devora}:${POSTGRES_PASSWORD:-devora_dev_password}@postgres:5432/${POSTGRES_DB:-devoraindex}?schema=public
      REDIS_URL: redis://redis:6379
      OAUTH_ENCRYPTION_KEY: ${OAUTH_ENCRYPTION_KEY:?set OAUTH_ENCRYPTION_KEY in .env}
      OAUTH_CLIENT_PRIVATE_JWK: ${OAUTH_CLIENT_PRIVATE_JWK:-}
      OAUTH_CLIENT_NAME: ${OAUTH_CLIENT_NAME:-DevoraIndex}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devoraindex}
      POSTGRES_USER: ${POSTGRES_USER:-devora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devora_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
